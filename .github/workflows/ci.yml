name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Job de Integração Contínua (CI)
  # Executa testes unitários e de integração no runner macOS.
  ci:
    name: Test & Check (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Run Tests
        run: cargo test --verbose

  # 2. Job de Entrega Contínua (CD)
  # Compila os binários nativos para arm64 e x86_64 e publica no GitHub Releases.
  # Só executa em pushes na branch main após o CI passar.
  cd:
    name: Build & Release (macOS)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Generate Version Tag
        shell: bash
        run: |
          VERSION_TAG="v$(date +'%Y%m%d-%H%M%S')"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      - name: Build Binaries (arm64 & x64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p bin
          cp target/aarch64-apple-darwin/release/sunshine-vd bin/sunshine-vd-macos-arm64-${{ env.VERSION_TAG }}
          cp target/x86_64-apple-darwin/release/sunshine-vd bin/sunshine-vd-macos-x64-${{ env.VERSION_TAG }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          draft: false
          prerelease: false
          files: |
            bin/sunshine-vd-macos-x64-${{ env.VERSION_TAG }}
            bin/sunshine-vd-macos-arm64-${{ env.VERSION_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
